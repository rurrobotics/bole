---
name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only and Vagrant-only changes don't change the image
    # (path filters are ignored for tag pushes, so releases always build).
    paths-ignore:
      - "**.md"
      - LICENSE
      - Vagrantfile
      - tests/**
      - .github/workflows/lint.yml
  workflow_dispatch:

permissions:
  contents: write # attach images to releases

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Native arm64 runner (free for public repositories): no emulation needed.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      PACKER_PLUGIN_PATH: ${{ github.workspace }}/.packer/plugins
      PACKER_CACHE_DIR: ${{ github.workspace }}/packer_cache
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/ansible/collections
      DONT_SETUP_QEMU: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs tags

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xz-utils kpartx parted fdisk qemu-utils e2fsprogs dosfstools
          pipx install ansible-core

      - uses: hashicorp/setup-packer@v3
        with:
          version: "1.16.2"

      - name: Cache Ubuntu base image
        uses: actions/cache@v6
        with:
          path: packer_cache
          key: ubuntu-base-${{ hashFiles('packer/variables.pkr.hcl') }}

      - name: Install Ansible collections and Packer plugin
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections
          packer/install-plugin.sh

      - name: Determine version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Validate template
        run: packer validate -var "version=${{ steps.version.outputs.version }}" packer/

      - name: Build image
        run: |
          mkdir -p output # the arm builder does not create it
          sudo --preserve-env=PACKER_PLUGIN_PATH,PACKER_CACHE_DIR,ANSIBLE_COLLECTIONS_PATH,DONT_SETUP_QEMU \
            env "PATH=$PATH" packer build -var "version=${{ steps.version.outputs.version }}" packer/
          sudo chown -R "$(id -u):$(id -g)" output packer_cache
          ls -lh output/

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: bole-${{ steps.version.outputs.version }}
          path: |
            output/*.img.xz
            output/*.img.xz.sha256
          compression-level: 0 # already xz-compressed
          retention-days: 14
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            output/*.img.xz
            output/*.img.xz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
