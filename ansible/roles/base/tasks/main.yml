---
- name: Validate build mode and target
  ansible.builtin.assert:
    that:
      - bole_build_mode in ['image', 'live']
      - bole_target in ['pi', 'vagrant']
      - pi_model in ['all', 'pi4', 'pi5']
    fail_msg: "bole_build_mode must be image|live, bole_target pi|vagrant and pi_model all|pi4|pi5"
    quiet: true

- name: Prevent services from starting inside the image chroot
  ansible.builtin.copy:
    dest: /usr/sbin/policy-rc.d
    mode: "0755"
    content: |
      #!/bin/sh
      # Installed by bole during the image build; removed by the cleanup role.
      exit 101
  when: bole_build_mode == 'image'

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
  when: base_apt_upgrade | bool

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages + base_extra_packages }}"
    state: present

- name: Remove snapd
  when: base_remove_snapd | bool
  block:
    - name: Purge snapd
      ansible.builtin.apt:
        name: snapd
        state: absent
        purge: true

    - name: Pin snapd so it is never pulled back in
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/no-snapd.pref
        mode: "0644"
        content: |
          Package: snapd
          Pin: release a=*
          Pin-Priority: -10

- name: Remove unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: absent
    purge: true
  when: base_remove_unattended_upgrades | bool

- name: Generate locale
  community.general.locale_gen:
    name: "{{ bole_locale }}"
    state: present

- name: Set default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    mode: "0644"
    content: |
      LANG={{ bole_locale }}

# The timezone is set by bole-apply-config from bole.yaml (bootconfig role).

- name: Configure Raspberry Pi hardware interfaces
  ansible.builtin.blockinfile:
    path: /boot/firmware/config.txt
    marker: "# {mark} bole managed block"
    insertafter: EOF
    block: "{{ lookup('ansible.builtin.template', 'config.txt.j2') }}"
  when: bole_target == 'pi'
