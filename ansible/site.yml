# See group_vars/all.yml for build-time settings and AGENTS.md for the
# image/live mode rules.
- name: Provision bole
  hosts: all
  become: true
  roles:
    - role: base
      tags: [base]
    - role: users
      tags: [users]
    - role: ssh
      tags: [ssh]
    - role: network
      tags: [network]
    - role: ros
      tags: [ros]
