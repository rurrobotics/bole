---
# bole: provision Ubuntu Server with ROS 2 for Raspberry Pi 4/5.
# See group_vars/all.yml for build-time settings and AGENTS.md for the
# image/live mode rules.
- name: Provision bole
  hosts: all
  become: true
  # A fixed PATH for the target. The chroot connection would otherwise inherit
  # the build host's PATH, which on hosts with a merged /usr/sbin (e.g. Fedora)
  # lacks the sbin directories Ubuntu tools like dpkg need.
  environment:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  roles:
    - role: base
      tags: [base]
    - role: users
      tags: [users]
    - role: ssh
      tags: [ssh]
    - role: network
      tags: [network]
    - role: ros
      tags: [ros]
    - role: bootconfig
      tags: [bootconfig]
    - role: ros_workspace
      tags: [ros_workspace]
    - role: cleanup
      tags: [cleanup]
      when: bole_build_mode == 'image'
