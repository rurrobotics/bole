---
# =============================================================================
# bole: BUILD-TIME configuration
#
# These values are baked into the image when it is built. Anything you may
# want to change after flashing (WiFi, passwords, SSH keys, ROS project...)
# belongs in the runtime file bole.yaml on the boot partition instead; see
# roles/bootconfig/templates/bole.yaml.j2.
#
# Override any value without editing this file:
#   ./packer/build.sh -var 'ansible_extra_vars=ros_distro=jazzy'
#   ansible-playbook site.yml -e ros_distro=jazzy
# =============================================================================

# ---- How the playbook runs ---------------------------------------------------
# image: provisioning a mounted image via chroot (Packer). Never start services.
# live:  provisioning a running machine (Vagrant VM or a real Pi over SSH).
bole_build_mode: live
# pi: Raspberry Pi hardware (config.txt, firmware, first-boot growpart).
# vagrant: x86 test VM; Pi-only tasks are skipped.
bole_target: pi

# ---- System ------------------------------------------------------------------
bole_hostname: bole
bole_timezone: Europe/Belgrade
bole_locale: en_US.UTF-8

# Run a full apt dist-upgrade during the build.
base_apt_upgrade: true
# Remove snapd (saves ~300 MB and boot time; ROS doesn't need it).
base_remove_snapd: true
# Remove unattended-upgrades so a robot never changes packages by itself.
base_remove_unattended_upgrades: true

base_packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - htop
  - i2c-tools
  - locales
  - nano
  - python3-yaml
  - rsync
  - tmux
  - vim-tiny
  - cloud-guest-utils # growpart, used by the first-boot service
  - openssl
base_extra_packages: []

# Raspberry Pi hardware interfaces (written to /boot/firmware/config.txt).
pi_enable_i2c: true
pi_enable_spi: true
pi_enable_uart: true
# Extra lines appended verbatim to config.txt, e.g. ["dtoverlay=pwm-2chan"].
pi_config_extra: []

# ---- Default user ------------------------------------------------------------
# The image ships with this user. Change the password after flashing via
# bole.yaml (user.password / user.password_hash) — the default is public!
bole_user: bole
# SHA-512 crypt hash of the default password "bole".
# Generate your own with:  openssl passwd -6
bole_user_password_hash: "$6$bolesalt0$YdTj6oP0AVUePff2yPrmQcUCE8Ym22mxiwG4oaTZkf5m7pAFXXkLLup5.k1wTT02/uurhNT0iy82oriiipOJ5/"
bole_user_groups:
  - adm
  - sudo
  - dialout
  - video
  - plugdev
  - gpio
  - i2c
  - spi
# Allow sudo without a password (convenient for development robots).
bole_user_passwordless_sudo: false

# ---- SSH ---------------------------------------------------------------------
# Default for password login; can be changed at runtime in bole.yaml.
ssh_password_auth: true
